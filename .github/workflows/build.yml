name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle 8.2
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.2'

      - name: Set up Android SDK
        run: |
          sudo mkdir -p /usr/local/android-sdk/cmdline-tools
          cd /usr/local/android-sdk/cmdline-tools
          sudo wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O cmdline-tools.zip
          sudo unzip -q cmdline-tools.zip
          sudo mv cmdline-tools latest
          echo "ANDROID_HOME=/usr/local/android-sdk" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=/usr/local/android-sdk" >> $GITHUB_ENV
          echo "/usr/local/android-sdk/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "/usr/local/android-sdk/platform-tools" >> $GITHUB_PATH

      - name: Install SDK packages
        run: |
          yes | sdkmanager --sdk_root=/usr/local/android-sdk --licenses || true
          sdkmanager --sdk_root=/usr/local/android-sdk "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: system-update-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
