services:
  - type: worker
    name: osint-bd-bot
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python main.py
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: HIBP_API_KEY
        sync: false
      - key: NUMVERIFY_KEY
        sync: false
      - key: HUNTER_API_KEY
        sync: false
      - key: IPINFO_TOKEN
        sync: false
